name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - backend/worker.py
      - backend/Dockerfile.worker
      - backend/data_collection/**
      - backend/requirements.txt
      - backend/data_collection/requirements.txt
      - .github/workflows/worker-deploy.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint worker
        run: |
          pip install ruff
          ruff check backend/worker.py
          ruff format --check backend/worker.py
          python -m py_compile backend/worker.py

  build:
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/correpb-worker" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container Apps Job
        run: |
          az containerapp job update \
            -n correpb-scraper \
            -g rg-circuitoapp \
            --image "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}" \
            --cpu 0.5 \
            --memory 1Gi
          echo "Worker atualizado: ${{ needs.build.outputs.digest }}"
