name: Deploy backend

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/gustavolsantos/correpb-backend:${{ github.event.workflow_run.head_sha }}

      - name: Make GHCR package public
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user/packages/container/correpb-backend/visibility \
              -d '{"visibility":"public"}')
            echo "PATCH visibility -> HTTP $code"
            [ "$code" = "204" ] && break
            sleep 10
          done

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate required secrets
        env:
          MONGODB_REMOTE_URI: ${{ secrets.MONGODB_REMOTE_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
          API_KEY: ${{ secrets.API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          err=0
          for v in MONGODB_REMOTE_URI  MONGODB_REMOTE_DB MONGO_DB_NAME \
                   MONGODB_COLLECTION API_KEY AWS_REGION AWS_ACCESS_KEY_ID \
                   AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret ausente ou vazio no GitHub: $v"
              err=1
            fi
          done
          exit $err

      - name: Deploy Container App
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          MONGODB_REMOTE_URI: ${{ secrets.MONGODB_REMOTE_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
          API_KEY: ${{ secrets.API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          az containerapp update \
            -n circuitoapp-api \
            -g rg-circuitoapp \
            -i "ghcr.io/gustavolsantos/correpb-backend:${IMAGE_TAG}" \
            --set-env-vars \
              MONGODB_REMOTE_URI="$MONGODB_REMOTE_URI" \
              MONGO_DB_NAME="$MONGO_DB_NAME" \
              MONGODB_COLLECTION="$MONGODB_COLLECTION" \
              API_PORT="8181" \
              API_KEY="$API_KEY" \
              AWS_REGION="$AWS_REGION" \
              AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              AWS_BUCKET_NAME="$AWS_BUCKET_NAME"
