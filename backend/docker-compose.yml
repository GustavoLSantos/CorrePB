version: '3.8'

services:
  scrapers:
    build:
      context: .
      dockerfile: ./data_collection/Dockerfile
    image: correpb-data:latest
    container_name: correpb-scrapers
    restart: "no"
    # Carrega credenciais (MongoDB Atlas + AWS) do backend/.env
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    # Mantém os CSVs/JSON gerados persistidos no host
    volumes:
      - ./data_collection/data:/app/data_collection/data
    command: ["python", "pipeline_agent.py"]